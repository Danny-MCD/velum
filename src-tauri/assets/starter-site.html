<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{SITE_NAME}}</title>
<!--
  Deliberately self-contained: no external fonts, scripts, or images.
  A page served as a Tor onion service shouldn't reach out to the clearnet
  for anything - visitors' Tor clients would have to fetch it too.
-->
<style>
  :root {
    --ink: #0d0b1a;
    --surface: rgba(255, 255, 255, 0.04);
    --line: rgba(255, 255, 255, 0.1);
    --gold: #e9c46a;
    --thread: #8a6fd6;
    --text: #f1eef9;
    --text-muted: #a79fc2;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
  }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    overflow: hidden;
  }

  .backdrop {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 0;
  }
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid var(--line);
  }
  .ring.r1 { width: 640px; height: 640px; animation: spin 120s linear infinite; }
  .ring.r2 { width: 460px; height: 460px; border-color: color-mix(in srgb, var(--thread) 35%, var(--line)); animation: spin 90s linear infinite reverse; }
  .ring.r3 { width: 300px; height: 300px; border-color: color-mix(in srgb, var(--thread) 55%, var(--line)); }
  .ring.core {
    width: 150px;
    height: 150px;
    border: none;
    background: radial-gradient(circle at 50% 42%, var(--gold) 0%, var(--thread) 60%, transparent 100%);
    filter: blur(0.5px);
    opacity: 0.55;
    animation: glow 5s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes glow {
    0%, 100% { opacity: 0.45; }
    50% { opacity: 0.7; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ring { animation: none !important; }
  }

  main {
    position: relative;
    z-index: 1;
    max-width: 640px;
    text-align: center;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 28px;
  }
  .brand-mark {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 42%, var(--gold) 0%, var(--thread) 60%, #1a1436 100%);
    box-shadow: 0 0 10px color-mix(in srgb, var(--gold) 45%, transparent);
    flex-shrink: 0;
  }

  h1 {
    font-size: clamp(32px, 6vw, 58px);
    font-weight: 500;
    line-height: 1.12;
    margin: 0 0 18px;
    text-wrap: balance;
  }

  p.lede {
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    color: var(--text-muted);
    margin: 0 auto;
    max-width: 46ch;
  }

  .note {
    margin-top: 40px;
    display: inline-block;
    font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    font-size: 12.5px;
    color: var(--text-muted);
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 999px;
    padding: 8px 16px;
  }
</style>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="ring core"></div>
  </div>

  <main>
    <div class="brand"><span class="brand-mark"></span> Published with Velum</div>
    <h1>{{SITE_NAME}}</h1>
    <p class="lede">
      This is a starter page, live on the Tor network as a real
      <code>.onion</code> address. Replace the files in this site's folder
      with your own whenever you're ready.
    </p>
    <div class="note">You're viewing this over Tor.</div>
  </main>
</body>
</html>
